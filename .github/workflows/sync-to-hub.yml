name: Sync to Hugging Face Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs fetch --all
          git lfs checkout

      - name: Debug Repository
        run: |
          echo "========== HEAD =========="
          git rev-parse HEAD

          echo ""
          echo "========== Last 10 commits =========="
          git log --oneline -10

          echo ""
          echo "========== Git Status =========="
          git status

          echo ""
          echo "========== LFS Files =========="
          git lfs ls-files

          echo ""
          echo "========== Searching for deleted dataset =========="
          git log --all -- dataset/motor_dataset_20260712_013436.csv || true

          echo ""
          echo "========== Current tree =========="
          find .

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote remove hf || true
          git remote add hf https://MitaliSwarooop:${HF_TOKEN}@huggingface.co/spaces/MitaliSwarooop/Motor-Predictive-API

          git push --force hf HEAD:main