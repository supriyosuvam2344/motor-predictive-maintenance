<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <linearGradient id="gear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#557a9e" />
      <stop offset="100%" stop-color="#233a54" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3f5a" />
      <stop offset="100%" stop-color="#0d1726" />
    </linearGradient>

    <linearGradient id="arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <g fill="url(#gear-grad)" filter="url(#drop-shadow)">
    <circle cx="50" cy="50" r="42" />
    <rect x="42" y="4" width="16" height="92" rx="2" />
    <rect x="42" y="4" width="16" height="92" rx="2" transform="rotate(45 50 50)" />
    <rect x="42" y="4" width="16" height="92" rx="2" transform="rotate(90 50 50)" />
    <rect x="42" y="4" width="16" height="92" rx="2" transform="rotate(135 50 50)" />
  </g>
  
  <circle cx="50" cy="50" r="32" fill="url(#shield-grad)" />

  <path d="M 50 20 L 72 26 L 72 52 C 72 70 50 84 50 84 C 50 84 28 70 28 52 L 28 26 Z" 
        fill="url(#shield-grad)" stroke="url(#gear-grad)" stroke-width="4" stroke-linejoin="round" filter="url(#drop-shadow)"/>

  <path d="M 33 55 L 43 40 L 52 65 L 62 42 L 67 52" 
        stroke="#4ade80" stroke-width="3" fill="none" stroke-linejoin="round" opacity="0.35"/>

  <g filter="url(#drop-shadow)">
    <path d="M 22 77 L 45 54 L 56 65 L 77 44" 
          stroke="url(#arrow-grad)" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="square"/>
    <polygon points="62,39 82,39 82,59" fill="url(#arrow-grad)" transform="translate(0, -5)" />
  </g>
</svg>
